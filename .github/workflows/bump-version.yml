name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute new version
        id: ver
        run: |
          CURRENT=$(jq -r '.version' GlobalExamSolver/manifest.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEW"

      - name: Update manifest.json
        run: |
          jq --arg v "${{ steps.ver.outputs.new }}" '.version = $v' \
            GlobalExamSolver/manifest.json > tmp.json
          mv tmp.json GlobalExamSolver/manifest.json
          cat GlobalExamSolver/manifest.json

      - name: Update ui.js version display
        run: |
          sed -i "s/GE-Bot v[0-9]\+\.[0-9]\+\.[0-9]\+/GE-Bot v${{ steps.ver.outputs.new }}/g" \
            GlobalExamSolver/ui.js

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GlobalExamSolver/manifest.json GlobalExamSolver/ui.js
          git commit -m "chore: bump version to v${{ steps.ver.outputs.new }}"
          git tag "v${{ steps.ver.outputs.new }}"
          git push origin HEAD --follow-tags
